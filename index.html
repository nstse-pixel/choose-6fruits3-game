<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>水果問答遊戲</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* iPad & Touch Screen Specific Optimizations */
        * {
            font-family: 'Noto Sans TC', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        html, body {
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            overscroll-behavior: none;
            background-color: #020617;
        }

        /* Floating Score Popups */
        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, 0) scale(1); }
            50% { opacity: 1; transform: translate(-50%, -45px) scale(1.3); }
            100% { opacity: 0; transform: translate(-50%, -90px) scale(0.9); }
        }

        .floating-text {
            position: absolute;
            animation: floatUp 0.85s ease-out forwards;
            pointer-events: none;
            z-index: 60;
            font-weight: 900;
            text-shadow: 0 4px 16px rgba(0,0,0,0.8);
        }

        /* Screen Shake on Incorrect Choice */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-18px); }
            40%, 80% { transform: translateX(18px); }
        }

        .shake-animation {
            animation: shake 0.35s ease-in-out;
        }

        /* Question Target Pulse Glow */
        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(253, 224, 71, 0.4)); }
            50% { transform: scale(1.06); filter: drop-shadow(0 0 25px rgba(253, 224, 71, 0.9)); }
        }

        .pulse-target {
            animation: pulseGlow 1.8s infinite ease-in-out;
        }

        /* Popup Overlay Animation */
        @keyframes popIn {
            0% { transform: scale(0.3); opacity: 0; }
            70% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .pop-overlay {
            animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .split-card {
            transition: transform 0.12s ease-out, background-color 0.25s ease, color 0.25s ease;
        }

        .split-card:active {
            transform: scale(0.96) !important;
        }
    </style>
</head>
<body class="bg-slate-950 text-white h-screen min-h-[100dvh] flex flex-col justify-between select-none">

    <!-- Cover Screen (全螢幕封面頁) -->
    <div id="start-screen" class="fixed inset-0 z-50 bg-slate-950 flex flex-col items-center justify-between p-6 sm:p-12 text-center">
        <!-- Top Visual Fruit Banner -->
        <div class="mt-6 flex items-center justify-center gap-3 sm:gap-6 text-4xl sm:text-6xl text-amber-400 font-bold tracking-widest animate-bounce">
            <span>🍊</span><span>🍎</span><span>🍌</span><span>🍓</span><span>🍐</span><span>🍇</span>
        </div>

        <!-- Center Focus Title (只顯示 水果問答遊戲) -->
        <div class="my-auto space-y-8 w-full max-w-2xl flex flex-col items-center justify-center">
            <h1 class="text-6xl sm:text-8xl md:text-9xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-orange-400 to-pink-500 drop-shadow-2xl leading-none tracking-tight">
                水果問答遊戲
            </h1>
        </div>

        <!-- Big Start Button -->
        <div class="w-full max-w-lg mb-8">
            <button onclick="startGame()" class="w-full py-6 sm:py-8 bg-gradient-to-r from-emerald-500 via-teal-500 to-emerald-600 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-black text-3xl sm:text-5xl rounded-3xl shadow-2xl transition transform active:scale-95 flex items-center justify-center gap-5 border-b-8 border-emerald-800">
                <i class="fa-solid fa-play text-3xl sm:text-5xl"></i> 開始遊戲
            </button>
        </div>
    </div>

    <!-- Main Game Play Screen -->
    <div id="game-screen" class="hidden flex-col h-screen h-[100dvh] w-screen relative overflow-hidden bg-slate-950">
        
        <!-- Header HUD Area -->
        <header class="bg-slate-950 border-b-2 border-slate-800 text-white px-4 py-3 z-30 flex items-center justify-between shrink-0 shadow-xl">
            <!-- Return to Cover Button -->
            <button onclick="exitToMenu()" class="w-12 h-12 sm:w-16 sm:h-16 rounded-2xl bg-slate-800 hover:bg-slate-700 text-slate-200 flex items-center justify-center text-xl sm:text-3xl transition active:scale-90 shadow-md border border-slate-700" title="返回主頁">
                <i class="fa-solid fa-house"></i>
            </button>

            <!-- Score Stats (無時間限制：累計答對 & 連擊) -->
            <div class="flex items-center gap-6 sm:gap-14">
                <div class="text-center">
                    <span class="text-xs sm:text-base text-gray-400 font-extrabold block">累計答對</span>
                    <span id="hud-correct-count" class="text-2xl sm:text-5xl font-black text-emerald-400 tracking-tight">0</span>
                </div>
                <div class="text-center">
                    <span class="text-xs sm:text-base text-gray-400 font-extrabold block">連擊 (Combo)</span>
                    <span id="hud-combo" class="text-2xl sm:text-5xl font-black text-orange-400 tracking-tight">0</span>
                </div>
            </div>

            <!-- Mute / Sound Toggle Button -->
            <button onclick="toggleAudio()" id="audio-btn" class="w-12 h-12 sm:w-16 sm:h-16 rounded-2xl bg-slate-800 hover:bg-slate-700 text-yellow-400 flex items-center justify-center text-xl sm:text-3xl transition active:scale-90 shadow-md border border-slate-700">
                <i class="fa-solid fa-volume-high" id="audio-icon"></i>
            </button>
        </header>

        <!-- Question Header with Voice Replay -->
        <div class="bg-slate-900 border-b-2 border-slate-800 px-4 py-3 sm:py-5 text-center z-20 shrink-0 shadow-2xl flex flex-row items-center justify-center gap-3 sm:gap-8 min-h-[90px]">
            <h2 class="text-2xl sm:text-4xl md:text-5xl font-black tracking-wide text-white flex items-center gap-2 flex-wrap justify-center">
                <span>哪一個是</span>
                <span id="question-target" class="text-yellow-300 underline underline-offset-8 decoration-4 decoration-amber-400 font-black px-4 py-1.5 bg-yellow-500/10 rounded-2xl pulse-target">蘋果</span>
                <span>？</span>
            </h2>

            <!-- Voice Replay Button (女聲重播) -->
            <button onclick="replayVoiceQuestion()" class="px-4 py-2.5 sm:px-6 sm:py-3.5 bg-pink-500 hover:bg-pink-400 text-white rounded-2xl font-black text-base sm:text-2xl shadow-lg transition transform active:scale-95 flex items-center gap-2 border-b-4 border-pink-700 shrink-0">
                <i class="fa-solid fa-volume-high text-xl sm:text-3xl"></i> 
                <span class="hidden sm:inline">重播語音</span>
                <span class="sm:hidden">重播</span>
            </button>
        </div>

        <!-- Main Dual Choice Display Area (二選一超大圖案欄位) -->
        <main class="flex-1 grid grid-cols-1 md:grid-cols-2 w-full relative overflow-hidden">
            
            <!-- Left Side Choice Card -->
            <button onclick="handleAnswer('left')" id="card-left" class="split-card relative flex flex-col items-center justify-center p-4 sm:p-8 w-full h-full cursor-pointer focus:outline-none select-none border-b-4 md:border-b-0 md:border-r-4 border-slate-950 group overflow-hidden">
                <div class="relative z-10 flex flex-col items-center justify-center transform transition-transform duration-200 w-full">
                    <!-- Super-Sized Fruit Emoji Display -->
                    <span id="left-emoji" class="text-[11rem] sm:text-[16rem] md:text-[20rem] lg:text-[24rem] drop-shadow-2xl leading-none transition-all duration-200 select-none">🍎</span>
                    <!-- Big Clear Name Label -->
                    <span id="left-text" class="mt-2 sm:mt-4 text-4xl sm:text-6xl md:text-7xl font-black tracking-wider text-center drop-shadow-2xl">蘋果</span>
                </div>
                <span class="absolute top-4 left-4 text-xs sm:text-lg font-black uppercase tracking-widest opacity-80 bg-black/40 text-white px-4 py-1.5 rounded-full backdrop-blur-md">選項 A</span>
                <div id="left-overlay" class="absolute inset-0 z-20 hidden items-center justify-center bg-black/40 backdrop-blur-xs"></div>
            </button>

            <!-- Right Side Choice Card -->
            <button onclick="handleAnswer('right')" id="card-right" class="split-card relative flex flex-col items-center justify-center p-4 sm:p-8 w-full h-full cursor-pointer focus:outline-none select-none group overflow-hidden">
                <div class="relative z-10 flex flex-col items-center justify-center transform transition-transform duration-200 w-full">
                    <!-- Super-Sized Fruit Emoji Display -->
                    <span id="right-emoji" class="text-[11rem] sm:text-[16rem] md:text-[20rem] lg:text-[24rem] drop-shadow-2xl leading-none transition-all duration-200 select-none">🍊</span>
                    <!-- Big Clear Name Label -->
                    <span id="right-text" class="mt-2 sm:mt-4 text-4xl sm:text-6xl md:text-7xl font-black tracking-wider text-center drop-shadow-2xl">橙</span>
                </div>
                <span class="absolute top-4 left-4 text-xs sm:text-lg font-black uppercase tracking-widest opacity-80 bg-black/40 text-white px-4 py-1.5 rounded-full backdrop-blur-md">選項 B</span>
                <div id="right-overlay" class="absolute inset-0 z-20 hidden items-center justify-center bg-black/40 backdrop-blur-xs"></div>
            </button>
        </main>
    </div>

    <script>
        // Web Audio Synthesizer Engine (Chimes & Error Sound Effects)
        class AudioEngine {
            constructor() {
                this.ctx = null;
                this.isMuted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                }
            }

            playCorrect() {
                if (this.isMuted) return;
                this.init();
                if (this.ctx.state === 'suspended') this.ctx.resume();

                const now = this.ctx.currentTime;
                const freqs = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                freqs.forEach((f, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(f, now + i * 0.05);
                    gain.gain.setValueAtTime(0.2, now + i * 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.05 + 0.25);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + i * 0.05);
                    osc.stop(now + i * 0.05 + 0.25);
                });
            }

            playWrong() {
                if (this.isMuted) return;
                this.init();
                if (this.ctx.state === 'suspended') this.ctx.resume();

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.exponentialRampToValueAtTime(70, now + 0.3);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.3);
            }

            playClick() {
                if (this.isMuted) return;
                this.init();
                if (this.ctx.state === 'suspended') this.ctx.resume();

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, now);
                osc.frequency.exponentialRampToValueAtTime(250, now + 0.05);
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.05);
            }
        }

        const audioEngine = new AudioEngine();

        // Speech Synthesis Helper configured specifically for Cantonese Female Voice (廣東話女聲)
        function speakQuestionText(fruitName) {
            if (!('speechSynthesis' in window) || audioEngine.isMuted) return;

            window.speechSynthesis.cancel(); // Clear any pending speech

            const phrase = `哪一個是${fruitName}？`;
            const utterance = new SpeechSynthesisUtterance(phrase);

            const voices = window.speechSynthesis.getVoices();
            
            // Search specifically for female Cantonese voices or default Cantonese with high pitch fallback
            const femaleCantonese = voices.find(v => 
                (v.lang.includes('zh-HK') || v.lang.includes('yue')) && 
                (v.name.includes('Sin-ji') || v.name.includes('HiuGa') || v.name.includes('Female') || v.name.includes('Ting-Ting') || v.name.includes('Mei-Jia'))
            );

            const anyCantonese = voices.find(v => v.lang.includes('zh-HK') || v.lang.includes('yue'));
            const anyChineseFemale = voices.find(v => 
                (v.lang.includes('zh') || v.lang.includes('cmn')) && 
                (v.name.includes('Female') || v.name.includes('Xiaoxiao') || v.name.includes('HsiaoChen') || v.name.includes('Mei-Jia'))
            );

            if (femaleCantonese) {
                utterance.voice = femaleCantonese;
                utterance.lang = 'zh-HK';
                utterance.pitch = 1.25; // Warm, natural female pitch
            } else if (anyCantonese) {
                utterance.voice = anyCantonese;
                utterance.lang = 'zh-HK';
                utterance.pitch = 1.30; // Elevated pitch for female voice
            } else if (anyChineseFemale) {
                utterance.voice = anyChineseFemale;
                utterance.lang = 'zh-TW';
                utterance.pitch = 1.25;
            } else {
                utterance.lang = 'zh-HK';
                utterance.pitch = 1.25; // Default pitch adjustment to 1.25 as requested
            }

            utterance.rate = 0.88; // Friendly pacing for kids/elderly
            window.speechSynthesis.speak(utterance);
        }

        // Voice Preloader for iPad / Safari
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

        // Fruits Dataset (橙, 蘋果, 香蕉, 士多啤梨, 雪梨, 提子)
        const FRUITS = [
            { name: '橙', emoji: '🍊' },
            { name: '蘋果', emoji: '🍎' },
            { name: '香蕉', emoji: '🍌' },
            { name: '士多啤梨', emoji: '🍓' },
            { name: '雪梨', emoji: '🍐' },
            { name: '提子', emoji: '🍇' }
        ];

        // Vibrant High-Contrast Color Scheme Pairs (對比色大)
        const CONTRAST_PAIRS = [
            {
                leftBg: '#1E3A8A', leftText: '#FEF08A', // Dark Royal Blue vs Bright Yellow
                rightBg: '#D97706', rightText: '#0F172A' // Golden Amber vs Navy
            },
            {
                leftBg: '#831843', leftText: '#A7F3D0', // Deep Crimson Pink vs Mint Green
                rightBg: '#047857', rightText: '#FCE7F3' // Emerald Green vs Pink Light
            },
            {
                leftBg: '#4C1D95', leftText: '#BEF264', // Deep Violet vs Bright Lime
                rightBg: '#65A30D', rightText: '#FAF5FF' // Bright Lime vs Light Purple
            },
            {
                leftBg: '#9A3412', leftText: '#E0F2FE', // Deep Orange vs Sky Blue
                rightBg: '#0369A1', rightText: '#FFEDD5' // Deep Sky Blue vs Warm Orange
            },
            {
                leftBg: '#115E59', leftText: '#FECDD3', // Deep Teal vs Rose Pink
                rightBg: '#BE123C', rightText: '#CCFBF1' // Crimson Red vs Mint
            },
            {
                leftBg: '#312E81', leftText: '#FDE047', // Deep Indigo vs Bright Yellow
                rightBg: '#CA8A04', rightText: '#020617' // Rich Gold vs Black
            }
        ];

        let gameState = {
            combo: 0,
            correctCount: 0,
            targetFruit: null,
            leftFruit: null,
            rightFruit: null,
            correctSide: 'left',
            isProcessing: false
        };

        function startGame() {
            // Unlock AudioContext & Speech API on iOS / iPad touch event
            audioEngine.init();
            audioEngine.playClick();

            gameState.combo = 0;
            gameState.correctCount = 0;
            gameState.isProcessing = false;

            document.getElementById('hud-combo').textContent = '0';
            document.getElementById('hud-correct-count').textContent = '0';

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('game-screen').classList.add('flex');

            nextRound();
        }

        function nextRound() {
            gameState.isProcessing = false;

            // Clear previous overlays
            document.getElementById('left-overlay').classList.add('hidden');
            document.getElementById('left-overlay').classList.remove('flex');
            document.getElementById('right-overlay').classList.add('hidden');
            document.getElementById('right-overlay').classList.remove('flex');

            // Pick Target Fruit
            const targetIndex = Math.floor(Math.random() * FRUITS.length);
            gameState.targetFruit = FRUITS[targetIndex];

            // Pick Distractor Fruit
            let distractorIndex;
            do {
                distractorIndex = Math.floor(Math.random() * FRUITS.length);
            } while (distractorIndex === targetIndex);
            
            const distractorFruit = FRUITS[distractorIndex];

            // Randomize Choice Alignment
            const isLeftCorrect = Math.random() < 0.5;
            gameState.correctSide = isLeftCorrect ? 'left' : 'right';
            gameState.leftFruit = isLeftCorrect ? gameState.targetFruit : distractorFruit;
            gameState.rightFruit = isLeftCorrect ? distractorFruit : gameState.targetFruit;

            // Update Target Display
            document.getElementById('question-target').textContent = gameState.targetFruit.name;
            
            // Left Card Setup
            document.getElementById('left-emoji').textContent = gameState.leftFruit.emoji;
            document.getElementById('left-text').textContent = gameState.leftFruit.name;

            // Right Card Setup
            document.getElementById('right-emoji').textContent = gameState.rightFruit.emoji;
            document.getElementById('right-text').textContent = gameState.rightFruit.name;

            // Apply Random High Contrast Color Scheme
            const theme = CONTRAST_PAIRS[Math.floor(Math.random() * CONTRAST_PAIRS.length)];
            
            const cardLeft = document.getElementById('card-left');
            const cardRight = document.getElementById('card-right');

            cardLeft.style.backgroundColor = theme.leftBg;
            cardLeft.style.color = theme.leftText;

            cardRight.style.backgroundColor = theme.rightBg;
            cardRight.style.color = theme.rightText;

            // Speak question in female voice
            setTimeout(() => {
                speakQuestionText(gameState.targetFruit.name);
            }, 120);
        }

        function replayVoiceQuestion() {
            if (gameState.targetFruit) {
                speakQuestionText(gameState.targetFruit.name);
            }
        }

        function handleAnswer(selectedSide) {
            if (gameState.isProcessing) return;
            gameState.isProcessing = true;

            const isCorrect = (selectedSide === gameState.correctSide);
            const selectedCard = document.getElementById(`card-${selectedSide}`);
            const selectedOverlay = document.getElementById(`${selectedSide}-overlay`);

            selectedOverlay.classList.remove('hidden');
            selectedOverlay.classList.add('flex');

            if (isCorrect) {
                // Correct Selection
                audioEngine.playCorrect();
                gameState.correctCount++;
                gameState.combo++;

                // Green Checkmark
                selectedOverlay.innerHTML = `<span class="text-8xl sm:text-9xl text-emerald-400 drop-shadow-2xl pop-overlay">✔️</span>`;

                // Update HUD
                document.getElementById('hud-combo').textContent = gameState.combo;
                document.getElementById('hud-correct-count').textContent = gameState.correctCount;

                // Floating Visual Text
                spawnFloatingText('答對了！', selectedCard, '#4ADE80');

                setTimeout(() => {
                    nextRound();
                }, 650);

            } else {
                // Wrong Selection
                audioEngine.playWrong();
                gameState.combo = 0;
                document.getElementById('hud-combo').textContent = '0';

                // Red Cross Overlay
                selectedOverlay.innerHTML = `<span class="text-8xl sm:text-9xl text-red-500 drop-shadow-2xl pop-overlay">❌</span>`;

                // Highlight Correct Side
                const correctSide = gameState.correctSide;
                const correctOverlay = document.getElementById(`${correctSide}-overlay`);
                correctOverlay.classList.remove('hidden');
                correctOverlay.classList.add('flex');
                correctOverlay.innerHTML = `<span class="text-7xl sm:text-8xl text-yellow-300 drop-shadow-2xl pop-overlay">👈 這才是 ${gameState.targetFruit.name}</span>`;

                selectedCard.classList.add('shake-animation');
                spawnFloatingText('再試一次！', selectedCard, '#F87171');

                setTimeout(() => {
                    selectedCard.classList.remove('shake-animation');
                    nextRound();
                }, 1300);
            }
        }

        function spawnFloatingText(text, element, color) {
            const rect = element.getBoundingClientRect();
            const el = document.createElement('div');
            el.className = 'floating-text text-4xl sm:text-6xl';
            el.style.left = `${rect.left + rect.width / 2}px`;
            el.style.top = `${rect.top + rect.height / 3}px`;
            el.style.color = color;
            el.innerHTML = text;

            document.body.appendChild(el);
            setTimeout(() => el.remove(), 850);
        }

        function exitToMenu() {
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            audioEngine.playClick();
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        }

        function toggleAudio() {
            audioEngine.isMuted = !audioEngine.isMuted;
            const icon = document.getElementById('audio-icon');
            if (audioEngine.isMuted) {
                icon.className = 'fa-solid fa-volume-xmark text-red-400';
                if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            } else {
                icon.className = 'fa-solid fa-volume-high text-yellow-400';
                audioEngine.playClick();
                replayVoiceQuestion();
            }
        }
    </script>
</body>
</html>
